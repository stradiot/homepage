<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>martin // start</title>
<style>
  :root {
    --bg: #0a0b0d;
    --surface: #101216;
    --surface-2: #15181d;
    --border: #1d2127;
    --border-strong: #2a2f37;
    --text: #d8dde4;
    --text-dim: #7d8693;
    --text-faint: #4a525e;
    
    /* Farby */
    --accent: #5fdb82; /* default green */
    --accent-blue: #5b8def;
    --accent-amber: #f5a623;
    --accent-red: #ff5c57;
    --accent-purple: #c678dd;
    --accent-cyan: #56b6c2;
    
    --focus: #ffffff;
    --col-w: 220px;
  }
  html.light {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-2: #f1f1ee;
    --border: #e3e3df;
    --border-strong: #cfcfca;
    --text: #1a1d22;
    --text-dim: #5a626d;
    --text-faint: #9aa2ad;
    
    /* Farby pre svetlý režim */
    --accent: #1f8a44;
    --accent-blue: #2d62cf;
    --accent-amber: #b9710e;
    --accent-red: #d73a49;
    --accent-purple: #6f42c1;
    --accent-cyan: #005cc5;
    
    --focus: #0a0b0d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); height: 100%; }
  body {
    zoom: 1.5;
    font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.45;
    font-feature-settings: 'ss01', 'cv11';
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ───────── top bar ───────── */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--bg); z-index: 10;
  }
  .brand {
    display: flex; align-items: baseline; gap: 10px;
    color: var(--text-dim); font-size: 12px; letter-spacing: 0.02em; user-select: none;
  }
  .brand b { color: var(--text); font-weight: 600; letter-spacing: -0.01em; }
  .brand .cursor {
    display: inline-block; width: 8px; height: 14px; background: var(--accent);
    margin-left: 2px; vertical-align: middle;
    animation: blink 1.1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .clock {
    color: var(--text-dim); font-size: 12px; margin-left: auto;
    font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
  }
  .clock b { color: var(--text); font-weight: 500; }
  
  .searchwrap {
    flex: 1; max-width: 480px; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; transition: border-color 120ms;
  }
  .searchwrap:focus-within { border-color: var(--border-strong); }
  .searchwrap .slash { color: var(--text-faint); font-size: 12px; }
  .searchwrap input {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--text); font-family: inherit; font-size: 13px;
  }
  .searchwrap input::placeholder { color: var(--text-faint); }
  
  .kbd {
    font-size: 10px; padding: 2px 5px; border: 1px solid var(--border);
    border-radius: 3px; color: var(--text-dim); background: var(--surface-2); font-family: inherit;
  }
  .iconbtn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    width: 30px; height: 30px; border-radius: 4px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 120ms, border-color 120ms;
  }
  .iconbtn:hover { color: var(--text); border-color: var(--border-strong); }
  .iconbtn svg { width: 14px; height: 14px; }

  /* ───────── main layout ───────── */
  main {
    padding: 32px 28px 80px;
    display: flex; flex-direction: column; gap: 36px;
    max-width: 1100px; margin: 0 auto;
    width: 100%;
  }
  
  .section { 
    display: flex; flex-direction: column; width: 100%; 
  }
  .section-head {
    display: flex; align-items: baseline; gap: 14px;
    margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px dashed var(--border);
  }
  .section-title {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-dim); font-weight: 500;
    display: inline-flex; align-items: center;
  }
  .section-title-icon {
    display: flex; align-items: center; margin-right: 8px; color: var(--text-dim);
  }
  
  /* ───────── horizontal items grid ───────── */
  .category-grid {
    display: flex;
    flex-wrap: wrap;
    flex-direction: row;
    gap: 12px;
  }
  
  /* ───────── link cards ───────── */
  /* Dynamické priraďovanie lokálnych farieb (--c a --c-bg) na základe data-color */
  .link-card[data-color="green"]  { --c: var(--accent-green, var(--accent)); --c-bg: rgba(95,219,130,0.1); }
  .link-card[data-color="blue"]   { --c: var(--accent-blue);                 --c-bg: rgba(91,141,239,0.1); }
  .link-card[data-color="amber"]  { --c: var(--accent-amber);                --c-bg: rgba(245,166,35,0.1); }
  .link-card[data-color="red"]    { --c: var(--accent-red);                  --c-bg: rgba(255,92,87,0.1); }
  .link-card[data-color="purple"] { --c: var(--accent-purple);               --c-bg: rgba(198,120,221,0.1); }
  .link-card[data-color="cyan"]   { --c: var(--accent-cyan);                 --c-bg: rgba(86,182,194,0.1); }

  html.light .link-card[data-color="green"]  { --c-bg: rgba(31,138,68,0.1); }
  html.light .link-card[data-color="blue"]   { --c-bg: rgba(45,98,207,0.1); }
  html.light .link-card[data-color="amber"]  { --c-bg: rgba(185,113,14,0.1); }
  html.light .link-card[data-color="red"]    { --c-bg: rgba(215,58,73,0.1); }
  html.light .link-card[data-color="purple"] { --c-bg: rgba(111,66,193,0.1); }
  html.light .link-card[data-color="cyan"]   { --c-bg: rgba(0,92,197,0.1); }

  .link-card {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    text-decoration: none; color: var(--text);
    width: var(--col-w);
    transition: all 120ms;
    position: relative; overflow: hidden;
  }
  .link-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--c, var(--accent)); /* Pásik získa farbu */
    opacity: 0; transition: opacity 120ms;
  }
  .link-card:hover {
    background: var(--surface-2); border-color: var(--border-strong);
  }
  .link-card.focused {
    background: var(--c-bg, rgba(95,219,130,0.06));
    border-color: var(--c, var(--focus));
    box-shadow: 0 0 0 1px var(--c, var(--focus));
    transform: translateX(4px);
  }
  .link-card.focused::before { opacity: 1; }
  .link-card.dim { opacity: 0.2; pointer-events: none; }

  .card-icon {
    display: flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; 
    color: var(--c, var(--text-dim)); /* Ikona získa farbu */
    flex-shrink: 0;
  }
  .card-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .card-title { font-weight: 500; font-size: 12.5px; letter-spacing: 0.02em; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  .card-sub { font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.04em; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }

  /* ───────── status & help ───────── */
  .statusline {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 18px; padding: 6px 28px;
    border-top: 1px solid var(--border); background: var(--bg);
    font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.08em; z-index: 5;
  }
  .statusline .sep { color: var(--border-strong); flex-shrink: 0; }
  .statusline .hint { white-space: nowrap; flex-shrink: 0; }
  .statusline .hint b { color: var(--text-dim); font-weight: 500; }
  .statusline .right { margin-left: auto; display: flex; gap: 18px; align-items: center; flex: 1 1 auto; justify-content: flex-end; overflow: hidden; }
  .statusline #focused-url { color: var(--focus); letter-spacing: 0; text-transform: none; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .statusline #focused-url .arrow { color: var(--text-faint); margin-right: 8px; }

  .help-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .help-backdrop.open { display: flex; }
  .help { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 24px 28px; min-width: 340px; box-shadow: 0 30px 60px rgba(0,0,0,0.4); }
  .help h3 { margin: 0 0 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); font-weight: 500; }
  .help dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 18px; margin: 0; font-size: 12px; }
  .help dt { color: var(--text-dim); }
  .help dd { margin: 0; color: var(--text); }
  .help kbd { font-size: 11px; padding: 2px 6px; border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 3px; color: var(--text); background: var(--surface-2); font-family: inherit; margin-right: 4px; }
  ::selection { background: rgba(95,219,130,0.25); color: var(--text); }
  html.light ::selection { background: rgba(31,138,68,0.18); }
</style>
</head>

  gmail:     s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>`,
  calendar:  s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`,
  keep:      s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A6 6 0 1 0 7.5 11.5c.76.76 1.23 1.52 1.41 2.5h6.18z"></path></svg>`,

function getIcon(id, size = 16) {
  return (ICONS[id] || ICONS.default)(size);
}

// ═══════════════════════════════════════════════════════════════
// DOM BUILDER
// ═══════════════════════════════════════════════════════════════
const CONFIG = JSON.parse(document.getElementById('config').textContent);

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'dataset') Object.assign(node.dataset, v);
    else node[k] = v;
  }
  for (const child of children) {
    if (typeof child === 'string') node.insertAdjacentHTML('beforeend', child);
    else if (child) node.appendChild(child);
  }
  return node;
}

function buildCategory(cat) {
  const grid = el('div', { className: 'category-grid' });
  
  cat.links.forEach(l => {
    const card = el('a', {
      href: l.url,
      className: 'link-card',
      dataset: {
        url: l.url,
        color: l.color || 'green',
        search: `${cat.label} ${l.label} ${l.sub || ''} ${l.id}`.toLowerCase(),
      }
    });

    const iconHtml = `<div class="card-icon">${getIcon(l.id, 16)}</div>`;
    const infoHtml = `<div class="card-info">
                        <span class="card-title">${l.label}</span>
                        <span class="card-sub">${l.sub || l.url}</span>
                      </div>`;
    
    card.innerHTML = iconHtml + infoHtml;
    grid.appendChild(card);
  });

  return el('section', { className: 'section', dataset: { category: cat.id } },
    el('div', { className: 'section-head' },
      `<span class="section-title"><div class="section-title-icon">${getIcon(cat.icon, 14)}</div> ${cat.label}</span>`
    ),
    grid
  );
}

// FOCUS & NAV STATE
// ═══════════════════════════════════════════════════════════════
const search  = document.getElementById('search');
const countEl = document.getElementById('count');
const urlEl   = document.getElementById('focused-url');

const FS = {
  all:     [],   
  visible: [],   
  idx:     -1,   
  current: null, 

  init() {
    this.all = Array.from(document.querySelectorAll('.link-card'));
    this.visible = this.all.slice();
  },

  setFocus(i, scroll = true) {
    if (this.current) this.current.classList.remove('focused');
    if (this.visible.length === 0) {
      this.idx = -1; this.current = null;
      urlEl.innerHTML = ''; updateCount(); return;
    }
    this.idx = ((i % this.visible.length) + this.visible.length) % this.visible.length;
    this.current = this.visible[this.idx];
    this.current.classList.add('focused');
    
    urlEl.innerHTML = `<span class="arrow">↗</span>${this.current.dataset.url}`;
    if (scroll) this.current.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    updateCount();
  },

  clearFocus() {
    if (this.current) this.current.classList.remove('focused');
    this.current = null; this.idx = -1;
    urlEl.innerHTML = ''; updateCount();
  },

  applyFilter() {
    const q = search.value.trim().toLowerCase();
    this.visible = [];
    this.all.forEach(a => {
      const match = !q || a.dataset.search.includes(q);
      if (match) { a.classList.remove('dim'); this.visible.push(a); }
      else a.classList.add('dim');
    });
    this.clearFocus();
    if (q && this.visible.length > 0) this.setFocus(0);
    
    buildNavModel();
    updateCount();
  },
};

function updateCount() {
  if (search.value.trim()) {
    countEl.innerHTML = `<b style="color:var(--text-dim)">${FS.visible.length}</b> / ${FS.all.length}`;
  } else {
    countEl.innerHTML = `<b style="color:var(--text-dim)">${FS.all.length}</b> apps`;
  }
}

// ═══════════════════════════════════════════════════════════════
// 2D NAVIGATION MODEL
// ═══════════════════════════════════════════════════════════════
let navGrid = [];

function buildNavModel() {
  navGrid = [];
  const links = FS.visible;
  if (!links.length) return;

  let currentRow = [];
  let lastTop = links[0].offsetTop;

  links.forEach(l => {
    if (l.offsetTop > lastTop + 10) {
      navGrid.push(currentRow);
      currentRow = [];
      lastTop = l.offsetTop;
    }
    currentRow.push(l);
  });
  if (currentRow.length) navGrid.push(currentRow);
}

function navCoords(link) {
  for (let r = 0; r < navGrid.length; r++) {
    const c = navGrid[r].indexOf(link);
    if (c >= 0) return { r, c };
  }
  return null;
}

function navigate(dRow, dCol) {
  if (FS.idx < 0) { FS.setFocus(0); return; }
  const cur = FS.visible[FS.idx];
  const coords = navCoords(cur);
  
  if (!coords) {
    FS.setFocus(FS.idx + (dRow + dCol > 0 ? 1 : -1)); 
    return; 
  }
  
  let { r, c } = coords;

  if (dCol) {
    FS.setFocus(FS.idx + dCol);
  } else if (dRow) {
    r += dRow;
    if (r < 0) r = navGrid.length - 1;
    if (r >= navGrid.length) r = 0;    
    c = Math.min(c, navGrid[r].length - 1);
    
    const targetLink = navGrid[r][c];
    const targetIdx = FS.visible.indexOf(targetLink);
    if (targetIdx >= 0) FS.setFocus(targetIdx);
  }
}

// ═══════════════════════════════════════════════════════════════
// KEYBOARD & MOUSE EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════

function openFocused(e) {
  const a = FS.visible[FS.idx];
  if (!a) return;
  if (e.metaKey || e.ctrlKey) window.open(a.href, '_blank');
  else window.location.href = a.href;
}

const gSeq = { pending: false, arm() { this.pending = true; setTimeout(() => { this.pending = false; }, 400); } };

const KEY_ACTIONS = {
  '/':        e => { e.preventDefault(); search.focus(); search.select(); },
  '?':        e => { e.preventDefault(); document.getElementById('help').classList.toggle('open'); },
  Escape:     _e => { document.getElementById('help').classList.remove('open'); FS.clearFocus(); },
  t:          e => { e.preventDefault(); toggleTheme(); },
  j:          e => { e.preventDefault(); FS.idx < 0 ? FS.setFocus(0) : navigate(1,  0); },
  ArrowDown:  e => { e.preventDefault(); FS.idx < 0 ? FS.setFocus(0) : navigate(1,  0); },
  k:          e => { e.preventDefault(); FS.idx < 0 ? FS.setFocus(0) : navigate(-1, 0); },
  ArrowUp:    e => { e.preventDefault(); FS.idx < 0 ? FS.setFocus(0) : navigate(-1, 0); },
  l:          e => { e.preventDefault(); FS.idx < 0 ? FS.setFocus(0) : navigate(0,  1); },
  ArrowRight: e => { e.preventDefault(); FS.idx < 0 ? FS.setFocus(0) : navigate(0,  1); },
  h:          e => { e.preventDefault(); FS.idx < 0 ? FS.setFocus(0) : navigate(0, -1); },
  ArrowLeft:  e => { e.preventDefault(); FS.idx < 0 ? FS.setFocus(0) : navigate(0, -1); },
  Enter:      e => { if (FS.idx >= 0) { e.preventDefault(); openFocused(e); } },
  G:          _e => FS.setFocus(FS.visible.length - 1),
  g:          e => { if (e.shiftKey) return; if (gSeq.pending) { FS.setFocus(0); gSeq.pending = false; } else gSeq.arm(); },
};

search.addEventListener('input', () => FS.applyFilter());
search.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (search.value) { search.value = ''; FS.applyFilter(); } else search.blur();
  } else if (e.key === 'Enter') {
    if (FS.visible.length && FS.idx >= 0) openFocused(e);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault(); search.blur(); FS.setFocus(0);
  }
});

document.addEventListener('keydown', e => {
  const inInput = document.activeElement === search;
  if (e.key === '/' && !inInput) { KEY_ACTIONS['/'](e); return; }
  if (e.key === '?' && !inInput) { KEY_ACTIONS['?'](e); return; }
  if (e.key === 'Escape')        { KEY_ACTIONS['Escape'](e); return; }
  if (inInput) return;
  KEY_ACTIONS[e.key]?.(e);
});

window.addEventListener('resize', () => {
  buildNavModel();
});

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════

function toggleTheme() {
  const isLight = document.documentElement.classList.contains('light');
  document.documentElement.classList.toggle('light', !isLight);
  localStorage.setItem('lp.theme', !isLight ? 'light' : 'dark');
}

function tick() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const time = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const date = d.toLocaleDateString('en-CA'); 
  document.getElementById('clock').innerHTML = `<span style="opacity:.55">${date}</span> &nbsp; <b>${time}</b>`;
}

const main = document.getElementById('main');
CONFIG.categories.forEach(c => main.appendChild(buildCategory(c)));

FS.init();
buildNavModel();
updateCount();

if (localStorage.getItem('lp.theme') === 'light') { document.documentElement.classList.add('light'); }
tick();
setInterval(tick, 1000);

main.addEventListener('mouseover', e => {
  const a = e.target.closest('.link-card');
  if (a) { urlEl.innerHTML = `<span class="arrow">↗</span>${a.dataset.url}`; }
});
main.addEventListener('mouseleave', () => {
  if (FS.current) { urlEl.innerHTML = `<span class="arrow">↗</span>${FS.current.dataset.url}`; }
  else { urlEl.innerHTML = ''; }
});

document.getElementById('theme').addEventListener('click', toggleTheme);
document.getElementById('help-btn').addEventListener('click', () => { document.getElementById('help').classList.toggle('open'); });
document.getElementById('help').addEventListener('click', e => { if (e.target.id === 'help') document.getElementById('help').classList.remove('open'); });

</script>
